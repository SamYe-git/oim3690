<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter | Sam Ye</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Converter-specific styles — reuses color variables from styles.css */
    .converter input[type="number"] {
      width: 100%;
      max-width: 240px;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--cream-dark);
      border-radius: 6px;
      background: #fff;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--text);
    }

    .converter input[type="number"]:focus-visible {
      outline: 2px solid var(--forest-light);
      outline-offset: 1px;
    }

    .converter button {
      border: none;
      cursor: pointer;
      font-family: var(--font-body);
    }

    .converter-layout {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 2rem;
    }

    .converter-form {
      flex: 1;
      min-width: 240px;
    }

    #mood-image {
      flex: 0 0 260px;
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(31, 61, 46, 0.18);
    }

    #result {
      margin-top: 1.5rem;
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--forest);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html">Sam Ye</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about-me.html">About</a>
        <a href="interests.html">Interests</a>
        <a href="form-demo.html">Form Demo</a>
        <a href="todo.html">To-Do</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="converter">
      <h2>Temperature Converter</h2>

      <div class="converter-layout">
        <div class="converter-form">
          <div class="form-row">
            <label for="celsius">Celsius</label>
            <input type="number" id="celsius" placeholder="Enter °C">
          </div>
          <button id="convert-btn" class="button">Convert</button>

          <p id="result"></p>
        </div>

        <img id="mood-image" src="" alt="" hidden>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Contact me at <a href="mailto:sye1@babson.edu">sye1@babson.edu</a></p>
      <p>&copy; <time datetime="2026">2026</time> Sam Ye</p>
    </div>
  </footer>

  <script>
    const celsiusInput = document.getElementById('celsius');
    const convertBtn = document.getElementById('convert-btn');
    const result = document.getElementById('result');
    const moodImage = document.getElementById('mood-image');

    // Pick an image for the temperature range, or null if none applies
    function getMoodImage(c) {
      if (c >= -10 && c <= 5) {
        return { src: 'images/so_colde.jpg', alt: 'So cold' };
      }
      if (c >= 15 && c <= 25) {
        return { src: 'images/good_vibe.jpg', alt: 'Good vibes' };
      }
      if (c > 30) {
        return { src: 'images/too_hote.jpg', alt: 'Too hot' };
      }
      return null;
    }

    function updateMoodImage(c) {
      const mood = getMoodImage(c);
      if (mood) {
        moodImage.src = mood.src;
        moodImage.alt = mood.alt;
        moodImage.hidden = false;
      } else {
        moodImage.hidden = true;
      }
    }

    function convert() {
      const c = parseFloat(celsiusInput.value);
      if (isNaN(c)) {
        result.textContent = 'Please enter a number.';
        moodImage.hidden = true;
        return;
      }
      const f = c * 9 / 5 + 32;
      result.textContent = `${c}°C = ${f.toFixed(1)}°F`;
      updateMoodImage(c);
    }

    convertBtn.addEventListener('click', convert);
  </script>
</body>
</html>
