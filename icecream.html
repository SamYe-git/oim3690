<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Cream Wheel</title>
  <style>
    :root {
      --bg: #ffd93b;        /* sunny yellow */
      --card: #fffbea;
      --ink: #2b2b2b;
      --muted: #6b6250;
      --accent: #2f5fa7;    /* denim blue */
      --accent-dark: #1f4078;
      --border: #2b2b2b;
      --metal: #b9bec6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Fredoka", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    /* goggle-strap header band */
    header {
      background: var(--ink);
      padding: 18px 16px 22px;
      text-align: center;
      border-bottom: 10px solid var(--accent);
      position: relative;
    }
    header .goggles { display: inline-flex; gap: 6px; margin-bottom: 8px; }
    header .lens {
      width: 46px; height: 46px; border-radius: 50%;
      background: #fff; border: 7px solid var(--metal);
      box-shadow: inset 0 0 0 3px #888;
    }
    h1 { margin: 0; font-size: 2.1rem; color: var(--bg); letter-spacing: .5px; }
    .sub { margin: 4px 0 0; color: #f3e7b0; }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }

    .layout { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

    .card {
      background: var(--card); border: 3px solid var(--border); border-radius: 18px; padding: 16px;
      box-shadow: 6px 6px 0 var(--accent);
    }
    .side .card { border-top: 14px solid var(--accent); }
    .wheel-wrap { position: relative; width: 100%; max-width: 520px; margin: 0 auto; aspect-ratio: 1; }
    canvas { width: 100%; height: 100%; display: block; }
    .pointer {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 16px solid transparent; border-right: 16px solid transparent;
      border-top: 30px solid var(--ink);
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
      z-index: 2;
    }

    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 700; border: 3px solid var(--ink); border-radius: 999px;
      padding: 12px 32px; cursor: pointer; background: var(--accent); color: #fff;
      box-shadow: 0 4px 0 var(--accent-dark); font-size: 1.1rem;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary {
      background: var(--bg); color: var(--ink); border: 2px solid var(--ink);
      padding: 6px 16px; font-weight: 600; font-size: .9rem; box-shadow: 0 3px 0 var(--ink);
    }

    .result { text-align: center; margin-top: 18px; min-height: 84px; }
    .result .label { color: var(--muted); font-size: .9rem; }
    .result .flavor { font-size: 1.6rem; font-weight: 700; margin: 4px 0; }
    .result .shop { display: inline-block; padding: 3px 12px; border-radius: 999px; color: #fff; font-size: .85rem; }

    h2 { font-size: 1rem; margin: 0 0 10px; }
    .shops label {
      display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer;
    }
    .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }
    .count { margin-left: auto; color: var(--muted); font-size: .85rem; }
    .row { display: flex; gap: 8px; margin: 8px 0 4px; }
    .total { color: var(--muted); font-size: .85rem; margin-top: 6px; }

    .side { display: grid; gap: 16px; }
    ul.history { list-style: none; padding: 0; margin: 0; }
    ul.history li { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); font-size: .9rem; }
    ul.history li:first-child { border-top: none; }
    ul.history .date { color: var(--muted); width: 56px; flex: none; }
    .empty { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
<header>
  <div class="goggles" aria-hidden="true"><span class="lens"></span><span class="lens"></span></div>
  <h1>🍌 Ice Cream of the Day 🍦</h1>
  <p class="sub">Spin the wheel to pick today's flavor.</p>
</header>
<main>

  <div class="layout">
    <section class="card">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="1040" height="1040"></canvas>
      </div>
      <div class="controls">
        <button id="spinBtn">Spin!</button>
      </div>
      <div class="result" id="result"></div>
    </section>

    <aside class="side">
      <div class="card">
        <h2>Shops on the wheel</h2>
        <div class="row">
          <button class="secondary" id="allBtn">All</button>
          <button class="secondary" id="noneBtn">None</button>
        </div>
        <div class="shops" id="shops"></div>
        <div class="total" id="total"></div>
      </div>
      <div class="card">
        <h2>Recent picks</h2>
        <ul class="history" id="history"></ul>
      </div>
    </aside>
  </div>
</main>

<script>
  // Menus rotate, so these lists are a snapshot. Edit them anytime.
  const SHOPS = [
    { name: "Ben & Jerry's", color: "#3a7bd5", flavors: [
      "Americone Dream", "Cherry Garcia", "Chocolate Chip Cookie Dough", "Chocolate Fudge Brownie",
      "Chunky Monkey", "Half Baked", "Phish Food", "The Tonight Dough", "Milk & Cookies",
      "New York Super Fudge Chunk", "Peanut Butter Cup", "Pistachio Pistachio", "Strawberry Cheesecake",
      "Vanilla", "Chocolate Therapy", "Coffee Coffee BuzzBuzzBuzz!", "Salted Caramel Core", "Cinnamon Buns",
      "Netflix & Chilll'd", "Chubby Hubby", "Karamel Sutra Core", "Peanut Butter Half Baked",
      "Chocolate Peanut Butter Split", "Gimme S'more!", "Everything But The...", "Coffee Toffee Bar Crunch",
      "Vanilla Toffee Bar Crunch", "Mint Chocolate Cookie", "Boom Chocolatta! Cookie Core",
      "Topped Salted Caramel Brownie", "Dirt Cake", "Glampfire Trail Mix", "Oat of This Swirled",
      "Caramel Chocolate Cheesecake", "Change the Whirled (Non-Dairy)",
      "Non-Dairy Chocolate Chip Cookie Dough", "Non-Dairy P.B. & Cookies"
    ]},
    { name: "Bruster's", color: "#e8a33d", flavors: [
      "Vanilla", "Chocolate", "Strawberry", "Butter Pecan", "Black Walnut", "Black Cherry",
      "Mint Chocolate Chip", "Cookies 'n Cream", "Cookie Dough", "Coffee", "Banana Pudding",
      "Birthday Cake", "Cotton Candy", "Bubble Gum", "Cherry Vanilla", "Chocolate Chip", "Coconut",
      "Pistachio Almond", "Rocky Road", "Cake Batter", "Salted Caramel Truffle", "Peanut Butter Cup",
      "Butterfinger", "Heath Bar Crunch", "Turtle", "Key Lime Pie", "Strawberry Cheesecake",
      "Peach (seasonal)", "Pumpkin (seasonal)", "Peppermint (seasonal)", "Orange Sherbet",
      "Rainbow Sherbet", "Mango Italian Ice", "Cherry Italian Ice", "Blue Raspberry Italian Ice",
      "No Sugar Added Vanilla"
    ]},
    { name: "Gelati Celesti", color: "#8e5bd6", flavors: [
      "Vanilla", "Chocolate", "Strawberry Cheesecake", "Just Ask", "Dark as Dark", "Salted Caramel",
      "Mint Chip", "Mud Pie", "Chocolate Chip Cookie Dough", "Ukrop's Rainbow Cookie", "The Dude",
      "Almond Amaretto", "Banana", "Cookies & Cream", "Butter Pecan", "Pistachio", "Coffee",
      "Peppermint Bark (seasonal)"
    ]},
    { name: "Scoop (RVA)", color: "#2fb39a", flavors: [
      "Brown Sugar Cookie Dough", "Dark Chocolate Sorbet", "Baklava", "Capital Trail Mix",
      "Cardamom Honeyed Pistachio", "Earl Grey", "Roasted Strawberry", "Vegan Chocolate Oreo",
      "Sweet Cream", "Vanilla Bean"
    ]},
    { name: "Dairy Queen", color: "#e0443e", flavors: [
      "Vanilla Soft Serve", "Chocolate Soft Serve", "Twist Cone", "Chocolate Dipped Cone",
      "Oreo Blizzard", "M&M's Blizzard", "Reese's Peanut Butter Cup Blizzard", "Butterfinger Blizzard",
      "Cookie Dough Blizzard", "Heath Blizzard", "Turtle Pecan Cluster Blizzard",
      "Choco Brownie Extreme Blizzard", "Mint Oreo Blizzard", "Snickers Blizzard",
      "Cotton Candy Blizzard", "Pumpkin Pie Blizzard (seasonal)", "Dilly Bar",
      "Peanut Buster Parfait", "Banana Split", "Hot Fudge Sundae", "Strawberry Sundae"
    ]},
    { name: "Blue Cow", color: "#3fa7d6", flavors: [
      "Birthday Cake", "Cookies & Cream", "Blue Cow Patty", "Chocolate Brownie",
      "Goat Cheese with Blueberry Swirl", "Sea Salt Brickle",
      "Ironclad Coffee with Bittersweet Chocolate Chips", "Strawberry Balsamic (seasonal)",
      "Cereal Milk", "Vanilla Bean"
    ]},
    { name: "Cold Stone Creamery", color: "#a0522d", flavors: [
      "Sweet Cream", "Cake Batter", "French Vanilla", "Chocolate", "Dark Chocolate", "Mint", "Coffee",
      "Strawberry", "Cheesecake", "Peanut Butter", "Pistachio", "Cotton Candy", "Banana", "Coconut",
      "Birthday Cake Remix", "Founder's Favorite", "Chocolate Devotion", "Peanut Butter Cup Perfection",
      "Mint Mint Chocolate Chocolate Chip", "Coffee Lovers Only", "Cookie Doughn't You Want Some",
      "Oreo Overload", "Our Strawberry Blonde", "Cheesecake Fantasy", "Apple Pie à la Cold Stone"
    ]},
    { name: "Jeni's", color: "#c2185b", flavors: [
      "Brambleberry Crisp", "Salted Peanut Butter with Chocolate Flecks", "Darkest Chocolate",
      "Gooey Butter Cake", "Brown Butter Almond Brittle", "Salty Caramel", "Vanilla Bean",
      "Coffee with Cream & Sugar", "Wildberry Lavender", "Milkiest Chocolate",
      "Sweet Cream Biscuits & Peach Jam", "Middle West Whiskey & Pecans", "Black Coffee",
      "Lemon Buttermilk Frozen Yogurt", "Strawberry Buttermilk", "Supermoon",
      "Dairy-Free Cold Brew with Coconut Cream", "Dairy-Free Texas Sheet Cake"
    ]}
  ];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const resultEl = document.getElementById("result");
  const shopsEl = document.getElementById("shops");
  const totalEl = document.getElementById("total");
  const historyEl = document.getElementById("history");

  // ---- storage helpers (fail quietly in private mode) ----
  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  let enabled = load("icecream-shops", SHOPS.map(s => s.name));
  let history = load("icecream-history", []); // [{date, flavor, shop}]
  let rotation = 0;   // current wheel angle (radians)
  let spinning = false;

  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  // ---- slices: every enabled flavor gets one slice ----
  function getSlices() {
    const slices = [];
    SHOPS.filter(s => enabled.includes(s.name)).forEach(shop => {
      shop.flavors.forEach(f => slices.push({ flavor: f, shop: shop.name, color: shop.color }));
    });
    // shuffle so flavors from the same shop aren't grouped together
    for (let i = slices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [slices[i], slices[j]] = [slices[j], slices[i]];
    }
    return slices;
  }
  let slices = getSlices();

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const c = v => Math.max(0, Math.min(255, v + amt));
    return `rgb(${c(n >> 16)}, ${c((n >> 8) & 255)}, ${c(n & 255)})`;
  }

  function drawWheel() {
    const size = canvas.width, r = size / 2 - 10, cx = size / 2, cy = size / 2;
    ctx.clearRect(0, 0, size, size);

    if (slices.length === 0) {
      ctx.fillStyle = "#eee";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#999"; ctx.font = "40px system-ui"; ctx.textAlign = "center";
      ctx.fillText("Pick at least one shop", cx, cy);
      return;
    }

    const arc = (Math.PI * 2) / slices.length;
    const fontSize = Math.max(11, Math.min(30, 900 / slices.length));
    const showLabels = slices.length <= 120;

    slices.forEach((s, i) => {
      const start = rotation + i * arc - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + arc);
      ctx.closePath();
      ctx.fillStyle = i % 2 ? s.color : shade(s.color, 28);
      ctx.fill();

      if (showLabels) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.fillStyle = "#fff";
        ctx.font = `600 ${fontSize}px system-ui`;
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        let label = s.flavor;
        const maxW = r - 110;
        while (ctx.measureText(label).width > maxW && label.length > 4) label = label.slice(0, -2);
        if (label !== s.flavor) label = label.trim() + "…";
        ctx.fillText(label, r - 16, 0);
        ctx.restore();
      }
    });

    // outer rim
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 12; ctx.strokeStyle = "#2b2b2b"; ctx.stroke();

    // center hub: goggle lens
    ctx.beginPath(); ctx.arc(cx, cy, 100, 0, Math.PI * 2);
    ctx.fillStyle = "#b9bec6"; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = "#2b2b2b"; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 74, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#7a7f87"; ctx.stroke();
    ctx.font = "70px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🍨", cx, cy + 4);
  }

  // which slice is under the top pointer?
  function sliceAtPointer() {
    const arc = (Math.PI * 2) / slices.length;
    const a = ((-rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    return slices[Math.floor(a / arc) % slices.length];
  }

  function spin() {
    if (spinning || slices.length === 0) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.innerHTML = `<div class="label">Spinning…</div>`;

    const startRot = rotation;
    const extra = Math.PI * 2 * (6 + Math.random() * 4) + Math.random() * Math.PI * 2;
    const duration = 5000;
    const t0 = performance.now();
    const easeOut = t => 1 - Math.pow(1 - t, 4);

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      rotation = startRot + extra * easeOut(t);
      drawWheel();
      if (t < 1) return requestAnimationFrame(frame);
      spinning = false;
      spinBtn.disabled = false;
      pick(sliceAtPointer());
    }
    requestAnimationFrame(frame);
  }

  function pick(s) {
    const today = todayKey();
    history = history.filter(h => h.date !== today);
    history.unshift({ date: today, flavor: s.flavor, shop: s.shop });
    history = history.slice(0, 30);
    save("icecream-history", history);
    showResult();
    renderHistory();
  }

  function showResult() {
    const today = history.find(h => h.date === todayKey());
    if (!today) {
      resultEl.innerHTML = `<div class="label">No flavor picked yet today.</div>`;
      spinBtn.textContent = "Spin!";
      return;
    }
    const color = (SHOPS.find(s => s.name === today.shop) || {}).color || "#999";
    resultEl.innerHTML = `
      <div class="label">Today's flavor</div>
      <div class="flavor">${today.flavor}</div>
      <span class="shop" style="background:${color}">${today.shop}</span>`;
    spinBtn.textContent = "Spin again";
  }

  function renderHistory() {
    const past = history.slice(0, 10);
    if (past.length === 0) {
      historyEl.innerHTML = `<li class="empty">Your picks will show up here.</li>`;
      return;
    }
    historyEl.innerHTML = past.map(h => {
      const [y, m, d] = h.date.split("-");
      return `<li><span class="date">${Number(m)}/${Number(d)}</span><span>${h.flavor} <span style="color:var(--muted)">· ${h.shop}</span></span></li>`;
    }).join("");
  }

  function renderShops() {
    shopsEl.innerHTML = SHOPS.map(s => `
      <label>
        <input type="checkbox" value="${s.name}" ${enabled.includes(s.name) ? "checked" : ""}>
        <span class="swatch" style="background:${s.color}"></span>
        ${s.name}
        <span class="count">${s.flavors.length}</span>
      </label>`).join("");
    totalEl.textContent = `${slices.length} flavors on the wheel`;
  }

  function updateEnabled(list) {
    enabled = list;
    save("icecream-shops", enabled);
    slices = getSlices();
    renderShops();
    drawWheel();
  }

  shopsEl.addEventListener("change", () => {
    updateEnabled([...shopsEl.querySelectorAll("input:checked")].map(i => i.value));
  });
  document.getElementById("allBtn").addEventListener("click", () => updateEnabled(SHOPS.map(s => s.name)));
  document.getElementById("noneBtn").addEventListener("click", () => updateEnabled([]));
  spinBtn.addEventListener("click", spin);

  renderShops();
  drawWheel();
  showResult();
  renderHistory();
</script>
</body>
</html>
