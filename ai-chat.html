<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Learning Buddy</title>
  <!-- marked turns the model's markdown (like **bold** or ```code```) into
       HTML. DOMPurify then strips anything unsafe before it is inserted, since
       the reply is inserted with innerHTML, not textContent. -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
  <div class="chat-container">
    <header>
      <h1>JS Learning Buddy 🤖</h1>
      <p>A chatbot tutor to help you learn JavaScript. Ask about syntax, concepts, or paste code you're stuck on.</p>
    </header>

    <div id="chatWindow" aria-live="polite"></div>

    <form id="chatForm">
      <textarea id="prompt" placeholder="Ask something about JavaScript..." rows="1" required></textarea>
      <button type="submit" id="askBtn">Send</button>
      <button type="button" id="clearBtn">Clear</button>
    </form>
  </div>

  <script>
    // This page works only on your vercel.app link. Live Server and GitHub Pages
    // cannot run the function in api/ask.js, so there the Send button fails.

    const chatWindow = document.querySelector('#chatWindow');
    const chatForm = document.querySelector('#chatForm');
    const promptEl = document.querySelector('#prompt');
    const askBtn = document.querySelector('#askBtn');
    const clearBtn = document.querySelector('#clearBtn');

    // The conversation so far, in the shape the Responses API expects:
    // [{ role: "user", content: "..." }, { role: "assistant", content: "..." }, ...]
    // Sending the whole history (not just the latest message) each time is
    // what lets the bot remember earlier turns.
    let history = [];

    const GREETING = "Hi! I'm your JavaScript learning buddy. Ask me about " +
      "variables, functions, loops, arrays, objects, or anything else " +
      "JS-related, and I'll do my best to explain it clearly.";

    function addMessage(role, text) {
      const bubble = document.createElement('div');
      bubble.className = `message ${role}`;
      if (role === 'bot') {
        // The model answers in markdown (lists, **bold**, code blocks, ...).
        // marked turns that into HTML, and DOMPurify removes anything unsafe
        // before it is inserted, so the markdown renders instead of showing
        // the raw asterisks and backticks.
        bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));
      } else {
        // User input and our own status/error text are shown as-is.
        bubble.textContent = text;
      }
      chatWindow.append(bubble);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return bubble;
    }

    // Sends the running conversation to your own function at /api/ask. The
    // function adds the key and calls the model, so no key appears anywhere
    // on this page.
    async function askAI(messages) {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      const data = await response.json();
      // A model that reasons first puts a reasoning item ahead of the answer,
      // so find the item of type message, then read its text.
      const message = data.output.find(item => item.type === 'message');
      return message.content[0].text;
    }

    chatForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = promptEl.value.trim();
      if (!text) return;

      addMessage('user', text);
      history.push({ role: 'user', content: text });
      promptEl.value = '';

      // Turn the controls off until the answer arrives, so a second click
      // cannot send, and pay for, a second request.
      askBtn.disabled = true;
      clearBtn.disabled = true;
      const thinkingBubble = addMessage('thinking', 'Thinking...');

      try {
        const reply = await askAI(history);
        thinkingBubble.remove();
        addMessage('bot', reply);
        history.push({ role: 'assistant', content: reply });
      } catch (error) {
        thinkingBubble.remove();
        addMessage('error', 'Error: ' + error.message);
      } finally {
        // finally runs whether the call worked or failed.
        askBtn.disabled = false;
        clearBtn.disabled = false;
        promptEl.focus();
      }
    });

    // Enter sends the message; Shift+Enter adds a new line.
    promptEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    clearBtn.addEventListener('click', () => {
      history = [];
      chatWindow.replaceChildren();
      addMessage('bot', GREETING);
    });

    addMessage('bot', GREETING);
  </script>
</body>
</html>
