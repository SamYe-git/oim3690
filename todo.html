<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do | Sam Ye</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/todo.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar">
      <a class="brand" href="index.html">Sam Ye</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about-me.html">About</a>

        <a href="todo.html">To-Do</a>
        <a href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section id="todo">
      <h2>To-Do List</h2>

      <form id="todo-form" class="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="Add a new task..."
          autocomplete="off"
          required
        >
        <button type="submit" class="button">Add</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>

      <div class="todo-footer">
        <span id="todo-count">0 items left</span>
        <button id="clear-completed" class="button-outline">Clear completed</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>Contact me at <a href="mailto:sye1@babson.edu">sye1@babson.edu</a></p>
      <p>&copy; <time datetime="2026">2026</time> Sam Ye</p>
    </div>
  </footer>

  <script src="js/todo.js"></script>
</body>
</html>
