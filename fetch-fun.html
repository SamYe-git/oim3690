<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Fun | Sam Ye</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    main {
      max-width: 480px;
      margin: 48px auto;
      padding: 0 16px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #2f6fde;
      color: #fff;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #2459b8;
    }

    #send-button {
      background: #2e8b57;
    }

    #send-button:hover:not(:disabled) {
      background: #236b43;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 1.5em;
      color: #666;
    }

    #status.error {
      color: #c0392b;
    }

    #dog {
      display: block;
      max-width: 100%;
      max-height: 400px;
      margin: 16px auto 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fetch Fun</h1>
    <button id="dog-button" type="button">Show me a dog</button>
    <button id="send-button" type="button" disabled>Send this dog to the board</button>
    <p id="status" role="status"></p>
    <img id="dog" alt="A random dog" hidden>
  </main>

  <script>
    const button = document.getElementById('dog-button');
    const statusText = document.getElementById('status');
    const dogImage = document.getElementById('dog');
    const sendButton = document.getElementById('send-button');

    async function showDog() {
      statusText.textContent = 'Loading...';
      statusText.classList.remove('error');
      button.disabled = true;
      sendButton.disabled = true;

      try {
        // Await 1: send the request and wait for the response
        const response = await fetch('https://dog.ceo/api/breeds/image/random');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        // Await 2: read the response body as JSON
        const data = await response.json();

        // Read the image URL from data.message
        dogImage.src = data.message;
        dogImage.hidden = false;
        statusText.textContent = '';
      } catch (err) {
        console.error(err);
        statusText.textContent = "Couldn't fetch a dog. Check your connection.";
        statusText.classList.add('error');
      } finally {
        button.disabled = false;
        sendButton.disabled = dogImage.hidden;
      }
    }

    // Posts the dog on screen to the course message board
    async function sendDog() {
      statusText.textContent = 'Sending...';
      statusText.classList.remove('error');
      sendButton.disabled = true;

      try {
        const response = await fetch('https://oim.zhili.dev/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Token': 'SamYe-git' },
          body: JSON.stringify({ message: `Here's a dog: ${dogImage.src}` })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        statusText.textContent = 'Sent to the message board!';
      } catch (err) {
        console.error(err);
        statusText.textContent = "Couldn't send the dog. Check your connection.";
        statusText.classList.add('error');
        sendButton.disabled = false;
      }
    }

    button.addEventListener('click', showDog);
    sendButton.addEventListener('click', sendDog);
  </script>
</body>
</html>
